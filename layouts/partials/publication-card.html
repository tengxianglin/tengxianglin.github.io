<article class="publication-card"><div class="pub-visual"><img src="{{ .Params.image | default "/images/publication-qsf.svg" }}" alt=""></div><div><p class="meta">{{ .Params.publication_type }} · {{ .Params.year }}</p><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p class="authors">{{ .Params.authors | safeHTML }}</p><p class="venue">{{ .Params.venue }}</p><div class="links">{{ range .Params.links }}<a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>{{ end }}</div></div></article>
