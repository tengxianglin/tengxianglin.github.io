{{ define "main" }}<section class="page-hero compact"><p class="eyebrow">{{ with .Params.kicker }}{{ . }}{{ else }}Academic CV{{ end }}</p><h1>{{ .Title }}</h1>{{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}</section><section class="content grid-list">{{ .Content }}{{ range .Pages.ByDate.Reverse }}<article class="card"><p class="meta">{{ .Date.Format "2006" }}</p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Summary }}</p></article>{{ end }}</section>{{ end }}
